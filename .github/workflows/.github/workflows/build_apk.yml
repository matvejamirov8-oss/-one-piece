name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Найти папку проекта и версию Gradle
        id: detect
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle*' | head -n 1)")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          PROP_FILE="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          VER=$(grep -oP 'gradle-\K[0-9.]+' "$PROP_FILE" 2>/dev/null || echo "8.11.1")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.detect.outputs.version }}

      - name: Создать debug.keystore для подписи APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            BLOCK=$(grep -A 10 "debugConfig" app/build.gradle.kts 2>/dev/null || true)
            STORE_PASS=$(echo "$BLOCK" | grep -oP 'storePassword\s*=\s*"\K[^"]+' | head -n 1 || true)
            KEY_ALIAS=$(echo "$BLOCK" | grep -oP 'keyAlias\s*=\s*"\K[^"]+' | head -n 1 || true)
            KEY_PASS=$(echo "$BLOCK" | grep -oP 'keyPassword\s*=\s*"\K[^"]+' | head -n 1 || true)
            STORE_PASS=${STORE_PASS:-android}
            KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}
            KEY_PASS=${KEY_PASS:-$STORE_PASS}
            keytool -genkeypair -keystore debug.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Собрать Debug APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Выгрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: GomuArena-APK
          path: "**/build/outputs/apk/debug/*.apk"
